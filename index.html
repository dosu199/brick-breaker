<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="hud">
    <div class="stat">
      <span class="label">Score</span>
      <span id="score"><span id="score-zeros">00000</span><span id="score-value">0</span></span>
    </div>
    <div class="stat stat-center">
      <span class="label">Level <span id="level-name"></span></span>
      <div id="level-track"></div>
    </div>
    <div class="stat stat-right">
      <div class="stat lives-stat">
        <span class="label">Lives</span>
        <div id="lives" role="img"></div>
      </div>
      <span id="hint"><kbd>F</kbd> Fullscreen</span>
    </div>
  </header>

  <canvas id="game"></canvas>

  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/render.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/input.js"></script>
  <script src="js/paddle.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/bricks.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/powerup.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
