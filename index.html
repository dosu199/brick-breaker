<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The play field sits in the middle at a fixed portrait size; the panels
       fill the space on either side of it. -->
  <aside class="panel panel-left">
    <div class="stat">
      <span class="label">Score</span>
      <span id="score"><span id="score-zeros">00000</span><span id="score-value">0</span></span>
    </div>
    <div class="stat">
      <span class="label">Level</span>
      <span id="level-name"></span>
      <div id="level-track"></div>
    </div>
  </aside>

  <canvas id="game"></canvas>

  <aside class="panel panel-right">
    <div class="stat">
      <span class="label">Lives</span>
      <div id="lives" role="img"></div>
    </div>
    <div class="stat">
      <span class="label">Relics</span>
      <div id="relics"></div>
    </div>
    <span id="hint"><kbd>F</kbd> Fullscreen</span>
  </aside>

  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/render.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/input.js"></script>
  <script src="js/paddle.js"></script>
  <script src="js/ball.js"></script>
  <script src="js/bricks.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/powerup.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/relics.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
